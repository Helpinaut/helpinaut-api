version: "3.9"

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: helpinaut
      POSTGRES_PASSWORD: helpinaut
      POSTGRES_DB: helpinaut
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - uploads:/usr/src/app/uploads

volumes:
  postgres_data:
  uploads:
